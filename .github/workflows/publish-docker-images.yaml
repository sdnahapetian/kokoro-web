name: Build and publish Docker images

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The specific commit SHA or branch name to build from (e.g., main or a feature branch)
        required: true
        default: main
      tag:
        description: The version tag for the Docker image (e.g., 1.0.0)
        required: true
      latest:
        description: Choose "yes" to also tag the image as "latest"
        required: true
        type: choice
        options:
          - "no"
          - "yes"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-images:
    strategy:
      matrix:
        vars:
          [
            { os: ubuntu-24.04, platform: amd64 },
            { os: ubuntu-24.04-arm, platform: arm64 },
          ]

    name: Build and push images
    runs-on: ${{ matrix.vars.os }}
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the Docker image
        run: >
          docker build
          --tag ghcr.io/${{ github.repository }}:${{ github.event.inputs.tag }}-${{ matrix.vars.platform }}
          --build-arg TARGETPLATFORM=linux/${{ matrix.vars.platform }}
          --file docker/Dockerfile .

      - name: Push the Docker image
        run: docker push ghcr.io/${{ github.repository }}:${{ github.event.inputs.tag }}-${{ matrix.vars.platform }}

  merge-and-push-manifest:
    name: Merge manifest
    needs: build-and-push-images
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge and push manifest
        run: |
          docker manifest create ghcr.io/${{ github.repository }}:${{ github.event.inputs.tag }} \
          ghcr.io/${{ github.repository }}:${{ github.event.inputs.tag }}-amd64 \
          ghcr.io/${{ github.repository }}:${{ github.event.inputs.tag }}-arm64

          docker manifest push ghcr.io/${{ github.repository }}:${{ github.event.inputs.tag }}

          if [ "${{ github.event.inputs.latest }}" == "yes" ]; then
            docker manifest create ghcr.io/${{ github.repository }}:latest \
            ghcr.io/${{ github.repository }}:${{ github.event.inputs.tag }}-amd64 \
            ghcr.io/${{ github.repository }}:${{ github.event.inputs.tag }}-arm64

            docker manifest push ghcr.io/${{ github.repository }}:latest
          fi
